<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - NEWLY SLY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="container">
        <div class="nav-wrapper">
            <div class="logo">
                <div class="logo-placeholder">NEWLY SLY</div>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html" class="active">
                    <i class="fas fa-shopping-cart cart-icon"></i>
                    <span class="cart-count">0</span>
                </a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
</nav>

<!-- Cart Hero -->
<section class="hero" style="margin-top: 60px; min-height: 40vh;">
    <div class="hero-content">
        <h1>Shopping Cart</h1>
        <p>Review Your Items</p>
    </div>
</section>

<!-- Cart Section -->
<section class="section">
    <div class="cart-container">
        <!-- Empty Cart Message -->
        <div class="cart-empty" style="text-align: center; padding: 60px 20px; display: none;">
            <i style="font-size: 4rem; color: var(--accent-lime);">🛒</i>
            <div class="empty-cart">
                <p>Your cart is empty</p>
                <a href="shop.html" class="btn" style="display: inline-block; padding: 12px 30px; width: auto; text-decoration: none;">Continue Shopping</a>
            </div>
        </div>

        <!-- Cart Items -->
        <div class="cart-items">
            <!-- Items will be loaded by JavaScript -->
        </div>

        <!-- Cart Summary -->
        <div class="cart-summary" style="display: none;">
            <!-- Summary will be loaded by JavaScript -->
        </div>

        <!-- Continue Shopping Button -->
        <div style="margin-top: 30px; text-align: center;">
            <a href="shop.html" class="btn btn-coral" style="display: inline-block; padding: 12px 30px; width: auto; text-decoration: none;">Continue Shopping</a>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <p style="margin-bottom: 10px;">&copy; 2026 NEWLY SLY. All rights reserved.</p>
        <p>Powered by <a href="../index.html">Olifant Web Studio</a></p>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
