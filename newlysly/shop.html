<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - NEWLY SLY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="container">
        <div class="nav-wrapper">
            <div class="logo">
                <div class="logo-placeholder">NEWLY SLY</div>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html" class="active">Shop</a></li>
                <li><a href="cart.html">
                    <i class="fas fa-shopping-cart cart-icon"></i>
                    <span class="cart-count">0</span>
                </a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
</nav>

<!-- Shop Hero -->
<section class="hero" style="margin-top: 60px; min-height: 40vh;">
    <div class="hero-content">
        <h1>Shop Collection</h1>
        <p>Browse Our Complete Streetwear Range</p>
    </div>
</section>

<!-- Filters -->
<section class="section" style="padding: 30px 20px; border-bottom: 2px solid var(--accent-lime);">
    <div class="container">
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button class="btn filter-btn active" data-filter="all" onclick="filterProducts('all')" style="width: auto; padding: 10px 20px;">All Items</button>
            <button class="btn filter-btn" data-filter="shirts" onclick="filterProducts('shirts')" style="width: auto; padding: 10px 20px;">👕 Shirts</button>
            <button class="btn filter-btn" data-filter="hoodies" onclick="filterProducts('hoodies')" style="width: auto; padding: 10px 20px;">🧥 Hoodies</button>
            <button class="btn filter-btn" data-filter="pants" onclick="filterProducts('pants')" style="width: auto; padding: 10px 20px;">👖 Pants</button>
            <button class="btn filter-btn" data-filter="shoes" onclick="filterProducts('shoes')" style="width: auto; padding: 10px 20px;">👟 Shoes</button>
            <button class="btn filter-btn" data-filter="bags" onclick="filterProducts('bags')" style="width: auto; padding: 10px 20px;">🎒 Bags</button>
            <button class="btn filter-btn" data-filter="accessories" onclick="filterProducts('accessories')" style="width: auto; padding: 10px 20px;">⛓️ Accessories</button>
        </div>
    </div>
</section>

<!-- Products Grid -->
<section class="section">
    <div class="container">
        <div class="products" id="products-container">
            <!-- Products will be loaded by JavaScript -->
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <p style="margin-bottom: 10px;">&copy; 2026 NEWLY SLY. All rights reserved.</p>
        <p>Powered by <a href="../index.html">Olifant Web Studio</a></p>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
