<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - NEWLY SLY</title>
    <link rel="stylesheet" href="../assets/css/newly-sly.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <div class="logo">
                    <i class="fas fa-star"></i> NEWLY SLY
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html" class="active">Shop</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="cart.html" class="cart-link"><i class="fas fa-shopping-bag"></i> Cart <span class="cart-count">0</span></a></li>
                </ul>
                <div class="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Shop Section -->
    <section class="shop-section">
        <div class="container">
            <h1>Our Collection</h1>
            
            <div class="shop-wrapper">
                <!-- Filters -->
                <aside class="filters">
                    <h3>Filters</h3>
                    <div class="filter-group">
                        <h4>Category</h4>
                        <label><input type="checkbox" value="hoodies"> Hoodies</label>
                        <label><input type="checkbox" value="tshirts"> T-Shirts</label>
                        <label><input type="checkbox" value="pants"> Pants</label>
                        <label><input type="checkbox" value="caps"> Caps</label>
                    </div>
                    <div class="filter-group">
                        <h4>Price Range</h4>
                        <input type="range" id="priceRange" min="0" max="500" value="500">
                        <p>Up to $<span id="priceValue">500</span></p>
                    </div>
                </aside>

                <!-- Products Grid -->
                <div class="products-container">
                    <div class="products-grid" id="productsGrid">
                        <!-- Products loaded by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>About Us</h3>
                    <p>NEWLY SLY is your go-to destination for premium street wear fashion.</p>
                </div>
                <div class="footer-section">
                    <h3>Quick Links</h3>
                    <ul>
                        <li><a href="shop.html">Shop</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>Follow Us</h3>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-facebook"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-twitter"></i></a>
                    </div>
                </div>
            </div>
            <p class="footer-bottom">&copy; 2024 NEWLY SLY. All rights reserved.</p>
        </div>
    </footer>

    <script src="../assets/js/newly-sly.js"></script>
</body>
</html>
